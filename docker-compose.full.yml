services:
  payments-api:
    image: brnmatos/fcg-payments-api:1.0.2

    build:
      context: .
      dockerfile: Dockerfile.Api

    container_name: fcg-payments-api
    restart: on-failure

    ports:
      - "5003:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=payments-sqlserver,1433;Database=FCG_Payments;User Id=sa;Password=${PAYMENTS_SQL_PASSWORD:?Defina PAYMENTS_SQL_PASSWORD no arquivo .env};TrustServerCertificate=True"

      Jwt__SecretKey: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      Jwt__Issuer: "FCG.Users.Api"
      Jwt__Audience: "FCG.CloudGames"
      Jwt__ExpirationMinutes: "60"

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "${RABBITMQ_USERNAME:-fcg}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"

      Notifications__BaseUrl: "${NOTIFICATIONS_BASE_URL:-http://host.docker.internal:7071}"
      Notifications__FunctionKey: "${NOTIFICATIONS_FUNCTION_KEY:-}"

    depends_on:
      payments-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  payments-worker:
    image: brnmatos/fcg-payments-worker:1.0.2

    build:
      context: .
      dockerfile: Dockerfile.Worker

    container_name: fcg-payments-worker
    restart: on-failure

    environment:
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=payments-sqlserver,1433;Database=FCG_Payments;User Id=sa;Password=${PAYMENTS_SQL_PASSWORD:?Defina PAYMENTS_SQL_PASSWORD no arquivo .env};TrustServerCertificate=True"

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "${RABBITMQ_USERNAME:-fcg}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"
      RabbitMq__OrderPlacedQueue: payments-order-placed

      Notifications__BaseUrl: "${NOTIFICATIONS_BASE_URL:-http://host.docker.internal:7071}"
      Notifications__FunctionKey: "${NOTIFICATIONS_FUNCTION_KEY:-}"

    depends_on:
      payments-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  payments-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-payments-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${PAYMENTS_SQL_PASSWORD:?Defina PAYMENTS_SQL_PASSWORD no arquivo .env}"

    ports:
      - "1437:1433"

    volumes:
      - payments_sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${PAYMENTS_SQL_PASSWORD:?Defina PAYMENTS_SQL_PASSWORD no arquivo .env}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:-fcg}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  payments_sqlserver_data:
